<style>
/* Layout: one phone screen. Wordmark top-left, QR card as the anchor, then the Grand Prize banner. */
:root {
  --canvas: #f6f2ea;
  --surface: #fcf9f3;
  --ink: #0c2722;
  --muted: #4a5f59;
  --brand: #1c6b57;
  --accent: #e3b05a;
  --accent-strong: #c2872f;
  --line: #e4ddcf;
  --on-brand: #fcf9f3;
  --qr-bg: #ffffff;
  --qr-ink: #0c2722;
  --f-display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #0c2722; --surface: #12332d; --ink: #f6f2ea; --muted: #a9bdb6;
    --brand: #1c6b57; --accent: #e3b05a; --accent-strong: #e3b05a; --line: #22463f; --on-brand: #fcf9f3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --canvas: #0c2722; --surface: #12332d; --ink: #f6f2ea; --muted: #a9bdb6;
  --brand: #1c6b57; --accent: #e3b05a; --accent-strong: #e3b05a; --line: #22463f; --on-brand: #fcf9f3;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--canvas); color: var(--ink); font-family: var(--f-body); }
.page { max-width: 440px; margin: 0 auto; padding-inline: 20px; padding-block: 18px 28px; display: grid; gap: 22px; }
.top { display: flex; align-items: center; justify-content: space-between; }
.wordmark { font-family: var(--f-body); font-weight: 600; text-transform: uppercase; letter-spacing: 0.2em; font-size: 13px; color: var(--accent-strong); }

.scan { display: grid; gap: 14px; justify-items: center; text-align: center; }
.qr-card { background: var(--qr-bg); border-radius: 18px; padding: 18px; width: min(100%, 320px); box-shadow: 0 1px 0 var(--line), 0 10px 30px rgba(12, 39, 34, 0.10); }
.qr-card svg { display: block; width: 100%; height: auto; }
.scan h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(26px, 7.4vw, 32px); line-height: 1.08; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.link-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
.link-row a { font-family: var(--f-mono); font-size: 15px; color: var(--brand); text-decoration: none; border-bottom: 1.5px solid var(--accent); padding-bottom: 1px; }
:root[data-theme="dark"] .link-row a { color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .link-row a { color: var(--ink); } }
.copy { font: 500 12px var(--f-body); color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.copy:focus-visible, .link-row a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.prize { position: relative; background: var(--brand); color: var(--on-brand); border-radius: 18px; padding: 20px 20px 22px; display: grid; gap: 6px; overflow: hidden; }
.eyebrow { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); padding-right: 92px; }
.prize h2 { font-family: var(--f-display); font-weight: 800; font-size: 24px; line-height: 1.1; margin: 0; padding-right: 92px; text-wrap: balance; }
.amount { font-family: var(--f-display); font-weight: 800; font-size: clamp(40px, 12vw, 52px); line-height: 1; margin-top: 10px; font-variant-numeric: tabular-nums; }
.amount small { display: block; font-family: var(--f-mono); font-weight: 500; font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
.multi { font-size: 15px; line-height: 1.4; }
.multi b { color: var(--accent); font-weight: 600; }
.stamp { position: absolute; top: 16px; right: 16px; width: 80px; height: 80px; border-radius: 50%; background: var(--accent); color: var(--ink); display: grid; place-content: center; text-align: center; transform: rotate(-10deg); box-shadow: inset 0 0 0 3px var(--brand), inset 0 0 0 5px var(--accent); }
:root[data-theme="dark"] .stamp { color: #0c2722; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stamp { color: #0c2722; } }
.stamp strong { font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: 1; }
.stamp span { font-family: var(--f-mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 3px; }
.prize-banner { display: block; width: 100%; height: auto; }
.foot { font-size: 12px; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: no-preference) { .stamp { transition: transform .3s; } .stamp:hover { transform: rotate(-4deg); } }
</style>

<script>
(function(){
  var btn = document.getElementById("copy-link"), url = "https://dropshotplay.com";
  btn.addEventListener("click", function(){
    function done(){ btn.textContent = "Copied"; setTimeout(function(){ btn.textContent = "Copy link"; }, 1600); }
    try {
      navigator.clipboard.writeText(url).then(done, function(){ selectLink(); });
    } catch (e) { selectLink(); }
  });
  function selectLink(){
    var a = document.querySelector(".link-row a"), r = document.createRange(); r.selectNodeContents(a);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "Selected";
  }
  // Keep the screen on while the QR is being shown.
  async function wake(){ try { if ("wakeLock" in navigator && document.visibilityState === "visible") await navigator.wakeLock.request("screen"); } catch (e) {} }
  wake(); document.addEventListener("visibilitychange", wake);
})();
